      本任务当前还承担"让发件箱有界"的职责 —— 没有消费者时该表会无界增长。
      lockAtMostFor 暂定 PT1M（启发式，未按实测校准）。
      锁名必须与 @SchedulerLock(name=...) 完全一致，由门禁 `scheduler-lock-scope-consistency` 校验。

# ===================== 判定规则（取代固定清单，V9 §52） =====================
rule:
  statement: >-
    任一当前部署单元，凡其承载的业务域中存在 SSE/WS，都必须维护 Security Local Cache，
    并在 Wave 2 Staging 中验证封禁生效。
  derived_hosts:
    - dinqor-gateway
    - dinqor-core-host
    - dinqor-agent
    - dinqor-content-automation
    - dinqor-studio
  stream_hosts_by_wave:
    - wave1: [dinqor-gateway, dinqor-core-host]
    - wave2: [dinqor-gateway, dinqor-core-host, dinqor-agent, dinqor-content-automation]
    - wave3+: [dinqor-gateway, dinqor-core-host, dinqor-agent, dinqor-content-automation, dinqor-studio]
