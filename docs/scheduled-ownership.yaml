  - id: auth-refresh-ciphertext-cleanup
    logical_owner: identity
    current_deployment_owner: dinqor-core-host
    execution_mode: scheduled
    execution_scope: global_once
    singleton_strategy: mysql_shedlock
    status: active
    scan_ref: apps/core-host/src/main/java/com/xander/lab/identity/application/AuthRefreshCiphertextCleanup.java:70
    notes: >-
      V9 §41 / §43。UPDATE auth_refresh_token_history SET successor_token_ciphertext = NULL
      WHERE successor_ciphertext_expires_at < now AND successor_token_ciphertext IS NOT NULL。
      只清空字节、不删行 —— 密文窗口（秒级）远短于 Reuse 判定窗口（retained_until，24h），
      删行会让这段时间里的真实盗用无法被识别（§39 分支 3 依赖行还在）。
      **本任务不承担任何安全语义**：§43 明确「即使物理字段晚几十秒清空，业务代码也必须在
      grace 到期后拒绝返回」。代码侧已按此实现（重放路径解密前先问 isCiphertextReadable），
      所以本任务停摆、甚至被误删，都不会让过期密文重新可用。
      这条区分必须保留：一旦有人把它"优化"成安全边界（改成"密文为空即当作已过期"），
      任务停摆就变成了一个可利用的窗口。依赖 idx_refresh_history_ciphertext_expires。
      lockAtMostFor 暂定 PT2M（启发式，未按实测校准）。

