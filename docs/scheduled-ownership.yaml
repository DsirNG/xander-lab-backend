  - id: security-event-outbox-publisher
    logical_owner: identity
    current_deployment_owner: dinqor-core-host
    execution_mode: scheduled
    execution_scope: global_once
    singleton_strategy: mysql_shedlock
    status: active
    scan_ref: apps/core-host/src/main/java/com/xander/lab/identity/application/SecurityEventOutboxPublisher.java:123
    notes: >-
      V9 §27 的快路径：消费 security_event_outbox 并投递。
      **为什么是 global_once 而不是 per_instance**：本任务领取的是共享的发件箱行，
      投递成功后要把行标成 PUBLISHED —— 领取/标记状态是所有实例共用的，
      执行体只能有一个，否则 N 个实例各自领取同一批行、各自标记，
      "已投递"变成 N 份互相矛盾的判断。跨实例传播是"投递目标"的事（Wave 1 换 Redis PubSub），
      不是调度器的事。
      ⚠️ Wave 0A 能力边界：投递目标是本实例安全平面，所以快路径当前只对抢到锁的实例生效，
