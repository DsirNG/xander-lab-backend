    scan_ref: apps/core-host/src/main/java/com/xander/lab/identity/application/SecurityStateReconciler.java:147
    notes: >-
      低频全量对账兜底（5 分钟）。实例长时间离线后，本地游标可能落后于已被清理的历史区间，
      此时增量拉取会永久漏掉那一段 —— 全量刷新（listDisabled + replaceAll）保证最终收敛。
