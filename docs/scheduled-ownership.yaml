# CI 门禁 `scheduled-ownership-coverage` 校验：
#   1. scheduled-inventory.yaml 中每个 id 都必须在本文件出现（覆盖率 100%）
#   2. execution_mode / execution_scope 非空且取值合法
#   3. execution_scope = global_once  → singleton_strategy 必须存在（不得为 none）
#   4. execution_scope = per_instance → singleton_strategy 必须为 none / local_only
