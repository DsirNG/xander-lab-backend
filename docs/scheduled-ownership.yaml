  # ===================== V9 新增项（Wave 0A 设计，Wave 2 上线） =====================

  - id: auth-refresh-history-cleanup
    logical_owner: identity
    current_deployment_owner: dinqor-core-host
    execution_mode: scheduled
    execution_scope: global_once
    singleton_strategy: mysql_shedlock
    status: active
    scan_ref: apps/core-host/src/main/java/com/xander/lab/identity/application/AuthRefreshHistoryCleanup.java:85
    notes: >-
      V9 §41 / §42。DELETE FROM auth_refresh_token_history WHERE retained_until < now
      ORDER BY retained_until LIMIT ?。删的是**共享**表行 → global_once（多实例同时删同一段
      范围只会互相锁等待，换不来任何吞吐）。必须慢、必须小批：DELETE 持有索引范围锁，
      而该表同时被轮换写入，一次 10,000 行的集中 DELETE 会让正常的 refresh 请求排队等锁。
      依赖 idx_refresh_history_retained_until；缺了它这个 DELETE 会全表扫描。
      每批独立事务由 AuthRefreshRetentionService 提供 —— 循环里刻意不加 @Transactional，
      否则 20 批会合成一个长事务、且批间 sleep 期间一直持锁（4~8 秒），
      而这一点没有任何功能性症状，只在生产高峰暴露。
      §42 要求 DELETE 必须走 Primary：将来读写分离时本任务必须显式绑定主库数据源，
      不得跟随只读路由。MySQL-backed ShedLock，避免清理任务本身依赖 Redis。
      lockAtMostFor 暂定 PT5M（启发式，未按实测校准）。

