# DinQorAI 微服务迁移 — 能力清单基线（V9 §12）
#
# 目的：把 §2.3 的「既有能力守恒」元规则落成机器门禁，防止每一轮文档/代码修订
# 重演「补了又丢」。
#
# 本清单**只增不删**。任何能力项的消失都必须显式标注 status 与审批记录。
#
# CI 门禁 `capability-baseline-diff`：
#   - 能力项消失且 status 未标 retired          → CI 失败
#   - status = changed                          → 必须存在对应 contract-changes.yaml 条目
#   - status = retired                          → 必须存在安全 / 产品审批记录
#
# status 取值：
#   active    当前有效，且已被实现或已被设计覆盖
#   changed   语义发生变化（必须指向 contract-changes.yaml 的 id）
#   retired   显式退场（必须有 approval 字段）
#   planned   V9 引入的新能力，Wave 2 前必须落地

counts:
  total: 28
  planned: 15
  active: 11
  changed: 2
  retired: 0

capabilities:
  # ===================== 管理员封禁（现状是秒级生效，不得退化） =====================
  - id: admin-ban-new-request
    since: V7
    ref: V9 §26 / §28.1 / §48
    status: active
    evidence: "identity/application/UserAdminService.setUserStatus → revokeSessions(targetId)"
    notes: >-
      现状：Redis 正常时近实时撤销全部 Access（删除 login:token:<jwt> + 集合键）。
      新架构必须保持秒级：Gateway 每请求 JWT 验签后查本地 deniedAccountIds。
      禁止退化为等待 Access Token 30 分钟自然过期。
    acceptance: "P95 <= 1s / P99 <= 2s / hard bound <= 5s（新请求）"

  - id: admin-ban-established-sse
    since: V8
    ref: V9 §49 / §50 / §52 / §53
    status: active
    evidence: >-
      agent/api/AgentConversationController.createEmitter → new SseEmitter(0L)（永不超时，
      只在建连时鉴权一次）。已实现：SseConnectionHandle 登记进 ConnectionRegistry；
      send()/sendHeartbeat() 均先查 SecurityStateCache.isDisabled → completeSubscriber。
    notes: >-
      SSE 建连后整个流式过程不再校验任何身份或状态。封禁必须能终止已建立的流。
      实现：宿主本地连接注册表 + 主动断开（主要手段）+ 每次 send/heartbeat 前 O(1) 校验（兜底）。
    acceptance: "封禁事件到达宿主后，最长残留推送 <= 5s"
    hosts:
      - "agent/api/AgentConversationController（2 条流）"
      - "blogagent/api/BlogAgentController（3 条流，共用 SseSubscriber）"
      - "automation/infrastructure/BlogPlanSseService（1 条流；控制器只转发）"
      - "studio/api/Img2ThreeController（1 条流；无心跳，仅靠 reconciler）"
    verified_by: "docs/stream-hosts.yaml + ci_gates.py stream-ban-boundary-coverage"

  - id: admin-ban-established-ws
    since: V8
    ref: V9 §51 / §52 / §53
    status: active
    evidence: >-
      agent/api/AgentStreamWebSocketHandler.afterConnectionEstablished 取一次 userId 存局部变量。
      已实现：WsConnectionHandle 登记进 ConnectionRegistry；emit() 在每一帧出站前校验封禁，
      命中则 close(4403, ACCOUNT_DISABLED)；入口侧也拒绝封禁账号建连。
    notes: >-
      stream(...) 里唯一的身份判断原本是数据归属校验（userId.equals(snapshot.getUserId())），
      不是账号状态校验。现在封禁会主动 close(4403, ACCOUNT_DISABLED)，
      并且封禁后不再回客户端 ping 的 pong（否则客户端会误判链路健康并继续重连）。
    acceptance: "同 admin-ban-established-sse"
    verified_by: "AgentStreamWebSocketHandlerTest（5 个封禁用例）+ stream-ban-boundary-coverage"

  - id: admin-ban-outbox-is-optimization-not-guarantee
    since: V9
    ref: V9 §26 / §27 / §28.3
    status: active
    evidence: >-
      identity/application/AccountSecurityStateService.applyState 在事务内写 security_event_outbox；
      identity/application/SecurityEventOutboxPublisher（global_once + mysql_shedlock）消费；
      identity/application/SecurityStateReconciler（per_instance）按 change_seq 兜底。
    notes: >-
      发件箱是**延迟优化**，不是投递保证 —— 这个区分必须显式写下来，因为它极易被下一次修订抹掉。
      投递保证来自 account_security_state（SOT）+ 每实例 reconciler：发件箱事件即使永久投递失败
      （超过重试上界被记 DEAD），封禁仍会在 1.5 秒内由兜底路径到达每个宿主。
      ⚠️ 因此这条能力的失效方式是：**有人因为"快路径已经覆盖了"而删掉/停用 reconciler**。
      那一刻 DEAD 从"无害的降级"变成"封禁被永久静默丢弃"，而所有现有验收指标仍然通过。
      与 admin-ban-new-request 的 P95/P99 不同，本条目守的是「两条路径必须同时存在」。
    acceptance: >-
      DEAD 事件可查（status 字段 + log.error）且封禁仍在 §28.3 的 5 秒预算内收敛；
      per_instance 的 reconciler 与 global_once 的 publisher 同时存在，缺一即失败。
    verified_by: "SecurityEventOutboxPublisherTest（含 neverAdvancesTheReconcilerCursor / 判死边界）+ scheduler-lock-scope-consistency"

