    notes: >-
      这是把「封禁能终止已建立的流」从人工约定变成机器约束的那一步。
      前两版文档里这条能力反复"补了又丢"，根因是：新增一条 SSE 端点时，
      没有任何东西会提醒实现者去登记连接。本能力把这件事变成会失败的门禁：
      新流端点若不在 stream-hosts.yaml 里登记，CI 直接红。
      门禁同时校验 boundary_files 真实存在且确实引用了 ConnectionRegistry ——
      防止"文件在、里面没真的登记连接"的空壳登记。
      注意：机器只能回答"哪些路由是流"（route-inventory 的 stream 字段），
      "边界在哪个文件里"仍是人工语义（例如 notifications 的边界在 service 而非 controller），
      这正是 §13「机器约束 Key 集合 + 人工填写语义字段」的又一例。
    acceptance: "stream-ban-boundary-coverage 门禁通过，且对「移除宿主」/「指向无注册文件」两种注入都能 FAIL"

