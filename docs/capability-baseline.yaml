  - id: refresh-grace-idempotent-replay
    since: V7
    ref: V9 §35 / §37 / §38
    status: planned
    notes: "grace = 25s（refresh timeout 15s + 1 次退避重试 + 网络/调度余量 >= 5s）。第 2/3/N 次 replay 语义完全相同：始终返回同一个 RT1。"
    acceptance: "§97 门槛：grace 内多次 replay（第 2 / 第 3 / 第 N 次）"

  - id: refresh-reuse-detection
    since: V7
    ref: V9 §39
    status: planned
    notes: "四分支判定表缺一不可。第 3 行（超 grace 但仍在 retained_until 内）才判 theft 并 revoke family。"
    acceptance: "§97 门槛：grace 外 replay 触发 revoke；retention 外 replay 不触发 theft alarm"

  - id: refresh-garbage-token-no-family-revoke
    since: V7
    ref: V9 §39 第 4 行 / §39.1
    status: planned
    notes: >-
      【防 DoS 的安全设计，不是可选优化】sid 在明文前缀，日志/Referer/客户端存储任一处泄漏即可获得。
      若按「校验失败即可疑」处理，攻击者构造 rt_<已知sid>.<随机>.<随机> 反复提交即可让用户被反复强制登出。
      第 4 行必须返回 401 INVALID_REFRESH_TOKEN 且**不 revoke family**。
    acceptance: "§97 P0 阻断项：随机垃圾 token 导致 family revoke = 0"

  - id: bounded-replay-history
    since: V7
    ref: V9 §33 / §40 / §42 / §43
    status: planned
    evidence: >-
      四个实现点均已落地（但整个新 Token 模型在 auth.refresh.enabled=false 下未生效，故仍为 planned）：
      ① §40.2 写入规则 —— RefreshTokenService 轮换成功写 history 行时显式写 retained_until = now()+24h；
      ② §40.3 条数上界 —— AuthRefreshTokenHistoryMapper.pruneGenerationsBeyondBound（48 代）；
      ③ §42 时间清理 —— AuthRefreshHistoryCleanup + AuthRefreshRetentionService.deleteExpiredHistory；
      ④ §43 密文清空 —— AuthRefreshCiphertextCleanup + AuthRefreshRetentionService.clearExpiredCiphertext。
    notes: "retention = 24h，每 sid 最多最近 48 代。retained_until 在写 history 行时写入 now()+24h，不得留空、不得依赖后续任务回填。容量上界 ≈ 10,000 × 48 = 480,000 行（30m Access）。时间上界与条数上界必须同时生效 —— 只保留 grace 会让 25 秒之后的真实盗用无法被识别。"
    acceptance: "history 行数不超过容量上界；retained_until 无 NULL"
    verified_by: "AuthRefreshHistoryCleanupTest / AuthRefreshCiphertextCleanupTest / RetentionBatchLoopTest（批数上界、整轮时间边界一致、中断恢复、慢批退让）+ scheduler-lock-scope-consistency"

