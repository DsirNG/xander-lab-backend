# DinQorAI 微服务迁移 — 表归属清单（人工填写语义）
#
# 机器键集合来源：docs/table-inventory.yaml（由 scripts/migration/scan.py 生成）
# 本文件是 §66 GRANT 脚本的唯一输入：grants/<service>.sql 由本文件生成。
# CI 门禁 `table-ownership-drift` 会校验：
#   1. table-inventory.yaml 中每一张表都必须在本文件出现（覆盖率 100%）
#   2. 本文件不得出现 inventory 中不存在的表（幽灵条目）
#   3. 任何一张表只能有一个 logical_owner（唯一 Owner 原则，V9 §2.2）
#
# 字段说明：
#   logical_owner            业务 Owner，永不随部署方式变化
#   current_write_owner      Wave 0 现状下的唯一写者
#   target_deployment_unit   最终承载该表的部署单元（V9 §3 映射）
#   revoke_from_core_host_at 何时从 core-host REVOKE（V9 §54 五阶段 / §96 十步）
#   owner_transition         特殊三阶段切换（仅 agent_mcp_server，V9 §77），含结构化阶段与写权限声明
#   notes                    约束与风险备注

generated_from: docs/table-inventory.yaml
counts:
  total: 66

# --- 现状基线：Wave 0 全部表由单体唯一写入 -------------------------------
defaults:
  current_write_owner: xander-lab-backend
  revoke_from_core_host_at: wave2-drain-complete

