# ===================== 8. 兜底规则 =====================
default:
  read:
    methods: [GET, HEAD, OPTIONS]
    access: public
    identity_mode: optional
    token_location: header
    note: "未匹配的只读方法保持公开，与现状一致。"
  write:
    methods: [POST, PUT, PATCH, DELETE, ANY]
    access: authenticated
    identity_mode: required
    token_location: header
    note: "未匹配的写方法默认要求登录，避免新增私有接口因忘记登记而静默公开。"

# ===================== 9. 长连接（SSE / WS） =====================
# V9 §10 / §15.2 / §52：这些端点必须显式声明 token_location，
# 否则 Gateway 会在长连接入口误判为未认证。
streams:
  - id: agent-conversation-messages-stream
    match: {method: POST, path_pattern: /api/agent/conversations/*/messages/stream}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: agent
    stream: sse
    last_event_id: true
    note: "前端不是原生 EventSource，而是带鉴权拦截器的 axios 实例 + onDownloadProgress，因此可以发 Authorization 头。服务端 response.setHeader(\"X-Accel-Buffering\", \"no\") + new SseEmitter(0L)。Gateway 必须不缓冲、不吞 Last-Event-ID。"
  - id: agent-conversation-events
    match: {method: GET, path_pattern: /api/agent/conversations/*/events}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: agent
    stream: sse
    last_event_id: true
  - id: agent-ws-handshake
    match: {method: GET, path: /ws/agent}
    access: authenticated
    identity_mode: required
    token_location: header_or_query
    owner: agent
    stream: ws
    close_code_disabled: 4403
    note: >-
      V9 §10 示例写 token_location: query。实际 AgentStreamAuthHandshakeInterceptor 优先
      Authorization 头、回退 ?token=，所以本文件写 header_or_query。注意 setAllowedOriginPatterns(\"*\")
      现状是任意 Origin 都放行 —— 若将来把凭据放进 query 以支持更多客户端，必须同时加 Origin 白名单。
      端点路径是 /ws/agent（不是 V9 §10 示例里的 /api/v2/agents/ws/**），v2 迁移时须一并改名。
  - id: blogagent-task-messages-stream
    match: {method: POST, path_pattern: /api/blog-agent/tasks/*/messages/stream}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: blogagent
    stream: sse
    last_event_id: true
  - id: blogagent-task-events
    match: {method: GET, path_pattern: /api/blog-agent/tasks/*/events}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: blogagent
    stream: sse
    last_event_id: true
  - id: blogagent-task-run-stream
    match: {method: POST, path_pattern: /api/blog-agent/tasks/*/run/stream}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: blogagent
    stream: sse
    last_event_id: true
  - id: img2three-run-stream
    match: {method: POST, path_pattern: /api/img2three/tasks/*/run/stream}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: studio
    stream: sse
    last_event_id: true
    note: "Wave 2 之后、Wave 3 之前由 dinqor-core-host 承载，因此 core-host 必须实现 LocalSecurityStateCache 与连接注册表。"
  - id: notifications-events
    match: {method: GET, path: /api/notifications/events}
    access: authenticated
    identity_mode: required
    token_location: header
    owner: automation
    stream: sse
    last_event_id: true

