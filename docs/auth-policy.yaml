# ===================== 6b. 非 /api 前缀的公开路由（显式登记，避免兜底误放） =====================
public_non_api:
  - id: oauth-authorization-server-metadata
    match: {method: GET, path: /.well-known/oauth-authorization-server}
    owner: integration
    access: public
    identity_mode: none
    token_location: n/a
    note: "MCP OAuth 发现端点（RFC 8414），客户端必须先无凭据读取。"
  - id: oauth-protected-resource-metadata
    match: {method: GET, path: /.well-known/oauth-protected-resource}
    owner: integration
    access: public
    identity_mode: none
    token_location: n/a
    note: "MCP 受保护资源元数据（RFC 9728）。"
  - id: virtualpay-product-catalog
    match: {method: GET, path: /api/virtual-pay/products}
    owner: virtualpay
    access: public
    identity_mode: optional
    token_location: header
    note: "虚拟支付商品目录公开（订单创建、对账、私有订单状态仍需登录）。"
  - id: bloghtml-sandbox-page
    match: {method: GET, path_pattern: /blog-html/*/raw}
    owner: bloghtml
    access: public
    identity_mode: none
    token_location: n/a
    note: "沙箱页面路由故意放在 /api 之外，让 iframe 无需鉴权/CORS/Cookie 即可加载；CSP frame-ancestors 限制可嵌入站点。"
  - id: health-check
    match: {method: GET, path: /health}
    owner: shared-kernel
    access: public
    identity_mode: none
    token_location: n/a
    note: "自定义健康检查。Wave 1 接入 Actuator 后由 /actuator/health 取代，届时本条目进入退场流程。"
  - id: health-ready-check
    match: {method: GET, path: /health/ready}
    owner: shared-kernel
    access: public
    identity_mode: none
    token_location: n/a
    note: "就绪探针（V11 §27.1 第 9 步）：安全平面 READY 之前返回 503，部署侧的就绪探针指向这里。刻意用精确 path 而不是 /health/* 前缀，避免将来任何新增的 /health/... 路由被顺带公开。"

