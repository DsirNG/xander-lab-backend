    note: "浏览计数，匿名可写，按 IP 去重。带 Token 时仍解析身份。"
  - id: components-share
    match:
      method: POST
      path: /api/components/share
    access: public
    identity_mode: optional
    token_location: header
    owner: components
    versions: [v1]
