# DinQorAI 微服务迁移 — 鉴权策略清单（人工填写语义）
#
# 来源：apps/core-host/src/main/java/com/xander/lab/identity/security/AuthInterceptor.java
#       （全局唯一鉴权点，84 条 METHOD:/api/path 显式白名单 + 4 条前缀规则 + 兜底）
#       + agent/api/AgentWebSocketConfig.java（WS 握手，独立拦截器）
#       + 各 McpServerConfiguration（Servlet 注册，独立鉴权体系）
#
# 本文件是 Gateway 鉴权与授权的**唯一真源**（V9 §10）：
#   - v1/v2 双轨期间同时覆盖两代路由
#   - 禁止各服务各存一份白名单
#   - 禁止前缀级粗放放行（如 PUBLIC GET /api/v2/content/**）
#
# CI 门禁：
#   `auth-policy-coverage`      — route-inventory.yaml 中每个端点都必须被某条规则匹配
#   `auth-policy-token-location`— 每个 SSE/WS 端点必须有显式的 token_location
#
# token_location 取值（V9 §10 要求该维度必需）：
#   header             仅 Authorization: Bearer 头
#   query              仅查询参数（无 Header 通道）
#   header_or_query    优先 Header，回退 ?token=
#   n/a                不适用（无需身份）
#
# 注意：V9 §10 示例把 WS 写成 `token_location: query`。实际代码事实是
# AgentStreamAuthHandshakeInterceptor **优先取 Authorization 头，取不到才回退 ?token=**
# （注释原文：「Token 优先取 Authorization 头（与 HTTP 通道一致），iOS 等客户端可回退到
# token 查询参数」）。若策略模型只写 query，会与实现不符；因此本文件写 header_or_query，
# 既保留 §10 要表达的"必须允许 query 路径"，又不丢掉 Header 优先这一既有能力。

# ===================== 评估顺序（必须与 AuthInterceptor.preHandle 一致） =====================
evaluation_order:
  - 1-preflight-options
  - 2-excluded-independent-auth
  - 3-admin-prefix
  - 4-knowledge-base-prefix
  - 5-explicit-private-get
  - 6-explicit-public-write
  - 7-public-get-list
  - 8-protected-write-list
  - 9-default

# ===================== 1. 预检请求 =====================
preflight:
  match:
    method: OPTIONS
    path: /**
  access: public
  identity_mode: optional
  token_location: n/a
  note: "OPTIONS 不携带凭据，由 CORS 配置决定放行。必须早于 /api/admin 分支提前返回，否则真实请求会被拦截。"

# ===================== 2. 完全排除的路径（独立鉴权体系） =====================
# 语义：path.contains(pattern)，不是前缀匹配。
excluded:
  - id: excluded-auth-endpoints
    match:
      method: ANY
      path_contains: /api/auth/
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "登录 / 注册 / 刷新 / 登出自身就是鉴权入口。"
  - id: excluded-virtualpay-notify
    match:
      method: ANY
      path_contains: /api/virtual-pay/notify
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "第三方支付回调，走独立签名校验，不能要求登录态。**必须按 ANY 匹配**：路径上同时存在 GET /api/virtual-pay/notify（verifyNotifyUrl 探活）与 POST /api/virtual-pay/notify（真实回调），只按 POST 排除会让 GET 落到兜底规则。"
  - id: excluded-mcp-transport
    match:
      method: ANY
      path_contains: /api/mcp
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "MCP 入站传输（Streamable HTTP），走 OAuth + PKCE + Scope，不套业务 JWT。含 /api/mcp、/api/mcp/csdn、/api/mcp/dual、/api/mcp/juejin。"
  - id: excluded-mcp-root-transport
    match:
      method: ANY
      path: /mcp
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "MCP 规范根端点，走 OAuth + PKCE + Scope，不套业务 JWT；/api/mcp 作为兼容路径保留。"
  - id: excluded-studio-preview
    match:
      method: ANY
      path_contains: /api/studio/preview/
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "已由第 7 组 GET 公开列表覆盖 GET；此处排除 POST 等其余方法。"
  - id: excluded-swagger
    match:
      method: ANY
      path_contains: /swagger-ui
    access: excluded
    identity_mode: none
    token_location: n/a
  - id: excluded-openapi-docs
    match:
      method: ANY
      path_contains: /v3/api-docs
    access: excluded
    identity_mode: none
    token_location: n/a
  - id: excluded-security-state-sync
    match:
      method: ANY
      path_prefix: /internal/security-state/
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "Gateway 不套业务 JWT；core-host 内网 API 另用 X-DinQor-Internal-Token 且默认关闭。"
  - id: excluded-platform-credential-status-sync
    match:
      method: ANY
      path_prefix: /internal/integration/platform-credentials/
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "Core 凭证状态只读内网边界，另用 X-DinQor-Internal-Token 且默认关闭，不套业务 JWT。"
  - id: excluded-platform-credential-status-bridge
    match:
      method: ANY
      path_prefix: /internal/platform-integration/platform-credentials/
    access: excluded
    identity_mode: none
    token_location: n/a
    note: "Platform → Core 凭证状态桥，另用 X-DinQor-Internal-Token 且默认关闭，不套业务 JWT。"

# ===================== 3. 管理后台 =====================
# 必须在公开 GET 分支之前判断。
prefix_rules:
  - id: admin-console
    match:
      method: ANY
      path_prefix: /api/admin/
    access: admin
    identity_mode: required
    token_location: header
    owner: admin
    versions: [v1]
    note: "先走普通登录校验，再校验 JWT 内 role == ADMIN，其余角色一律 403。token 过期/签名变化按未登录（401）处理，避免 403 泄露角色信息。"
  - id: knowledge-base-private
    match:
      method: ANY
      path_prefix: /api/knowledge-base/
    access: authenticated
    identity_mode: required
    token_location: header
    owner: knowledgebase
    versions: [v1]
    note: "整段要求登录，而不是逐条登记路由 —— 未匹配的 GET 默认公开，逐条登记一旦漏一条就会静默泄露某个用户的文件内容。"

