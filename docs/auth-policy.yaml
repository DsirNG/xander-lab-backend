    owner: integration
  - id: juejin-authorization-start
    match: {method: POST, path: /api/publishing/juejin/authorization/start}
    owner: integration
  - id: juejin-authorization-cancel
    match: {method: POST, path: /api/publishing/juejin/authorization/cancel}
