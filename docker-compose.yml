version: '3.8'

services:
  xander-lab-backend:
    env_file:
      - .env.local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xander-lab-backend
    restart: unless-stopped
    ports:
      - "30002:30002"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms512m -Xmx512m
      # nginx 反代会保留浏览器 Origin 头，CORS 白名单必须包含线上页面地址以及本地开发环境
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://xander.dsircity.top}
      # 图片转 Three.js 配置
      - IMG2THREE_AGENT_BASE_URL=${IMG2THREE_AGENT_BASE_URL:-}
      - IMG2THREE_AGENT_API_KEY=${IMG2THREE_AGENT_API_KEY:-}
      - IMG2THREE_AGENT_MODEL=${IMG2THREE_AGENT_MODEL:-}
      # 数据库配置
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      # Redis 配置
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
      - SPRING_REDIS_PASSWORD=${SPRING_REDIS_PASSWORD:-}
      - SPRING_REDIS_DATABASE=${SPRING_REDIS_DATABASE:-0}
      # 邮件配置
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - SPRING_MAIL_USERNAME=resend
      - SPRING_MAIL_PASSWORD=${RESEND_API_KEY}
      # 定时邮件统一使用 UTC，并以 1 秒间隔检查到期任务
      - EMAIL_REMINDER_ENABLED=true
      - EMAIL_REMINDER_POLL_INTERVAL_MS=1000
      # 定时发文计划（AI 生成 + 自动发布），依赖已部署的数据库迁移
      - BLOG_CONTENT_PLAN_ENABLED=true
      # 阿里云 OSS 配置
      - ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID}
      - ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET}
      # JWT 配置
      - JWT_SECRET=${JWT_SECRET}
      # Remote MCP OAuth 配置
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-false}
      - MCP_OAUTH_AUTHORIZATION_REQUEST_TTL_SECONDS=${MCP_OAUTH_AUTHORIZATION_REQUEST_TTL_SECONDS:-600}
      - MCP_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS=${MCP_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS:-300}
      - MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS=${MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      - MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS=${MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      - MCP_BLOG_ENABLED=${MCP_BLOG_ENABLED:-false}
      - MCP_PUBLIC_BASE_URL=${MCP_PUBLIC_BASE_URL:-https://xander.dsircity.top}
      - CSDN_PUBLISH_ENABLED=${CSDN_PUBLISH_ENABLED:-false}
      - CSDN_API_BASE_URL=${CSDN_API_BASE_URL:-https://bizapi.csdn.net}
      - CSDN_API_KEY=${CSDN_API_KEY:-203803574}
      - CSDN_SELENIUM_URL=http://selenium:4444/wd/hub
      - CSDN_CREDENTIAL_ENCRYPTION_KEY=${CSDN_CREDENTIAL_ENCRYPTION_KEY:-}
      - CSDN_AUTHORIZATION_TIMEOUT_SECONDS=${CSDN_AUTHORIZATION_TIMEOUT_SECONDS:-180}
      # Juejin MCP publish; disabled until JUEJIN_CREDENTIAL_ENCRYPTION_KEY is injected.
      - MCP_JUEJIN_ENABLED=${MCP_JUEJIN_ENABLED:-false}
      - JUEJIN_PUBLISH_ENABLED=${JUEJIN_PUBLISH_ENABLED:-false}
      - JUEJIN_API_BASE_URL=${JUEJIN_API_BASE_URL:-https://api.juejin.cn}
      - JUEJIN_DEFAULT_AID=${JUEJIN_DEFAULT_AID:-2608}
      - JUEJIN_CREDENTIAL_ENCRYPTION_KEY=${JUEJIN_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      selenium:
        condition: service_healthy
    networks:
      - xander-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:30002/health"]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.xander-lab.description=Xander Lab Backend Application"
      - "com.xander-lab.version=1.0.0"

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: xander-lab-selenium
    restart: unless-stopped
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=false
      - SE_START_XVFB=false
    networks:
      - xander-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4444/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  xander-network:
    driver: bridge
