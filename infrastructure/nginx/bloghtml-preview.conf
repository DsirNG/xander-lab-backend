# V9 §78 — BlogHTML page origin bypasses the API Gateway.
# DNS must map *.blogHTML.dinqor.cn to this Nginx host.
upstream dinqor_bloghtml_preview {
    server 127.0.0.1:30003;
}

server {
    listen 443 ssl;
    server_name ~^(?<preview_id>[0-9a-f]{16})\.blogHTML\.dinqor\.cn$;

    # TLS certificate configuration is deployment-owned and intentionally omitted here.
    location = /raw {
        # The service endpoint retains the internal /blog-html/{id}/raw contract while the
        # public page URL stays on the per-session origin described in V9 §78.
        proxy_pass http://dinqor_bloghtml_preview/blog-html/$preview_id/raw;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
