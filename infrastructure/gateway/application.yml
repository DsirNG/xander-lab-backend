# V9 §15.2 / §86 / §92 — production overlay for the WebFlux Gateway.
# This file is loaded by the deployment configuration or Nacos, not by core-host.
spring:
  application:
    name: dinqor-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        # Streaming routes must not be cut off by the normal request timeout.
        response-timeout: -1ms
      default-filters:
        - PreserveHostHeader
      routes:
        - id: monolith-fallback
          uri: lb://dinqor-core-host
          predicates:
            - Path=/**
          filters:
            - AddResponseHeader=X-Accel-Buffering, no
          order: 9999

# Keep these names visible in the deployment config: the edge must not buffer SSE,
# consume Last-Event-ID, or strip WebSocket Upgrade/Connection semantics.
gateway:
  stream-proxy:
    preserve-response-header: X-Accel-Buffering
    preserve-request-header: Last-Event-ID
    websocket-upgrade: true
    response-timeout: disabled
