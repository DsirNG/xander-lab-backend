# V9 local verification infrastructure.
#
# This file intentionally starts only dependencies. Application services stay in
# docker-compose.wave1.yml / docker-compose.wave2-agent.yml so migration order and service
# ownership remain explicit. All three Compose files join the same configurable runtime
# network so service-name URLs work across Compose projects. The canonical schema name is
# xander_lab, matching migrations/, grants/ and the production Nacos JDBC defaults.
services:
  mysql:
    image: mysql:8.0.36
    container_name: ${DINQOR_LOCAL_MYSQL_CONTAINER:-dinqor-local-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DINQOR_LOCAL_MYSQL_ROOT_PASSWORD:?set DINQOR_LOCAL_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xander_lab
    ports:
      - ${DINQOR_LOCAL_MYSQL_PORT:-3306}:3306
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dinqor-local-mysql-data:/var/lib/mysql
    networks:
      - dinqor-runtime

  redis:
    image: redis:7-alpine
    container_name: ${DINQOR_LOCAL_REDIS_CONTAINER:-dinqor-local-redis}
    restart: unless-stopped
    ports:
      - ${DINQOR_LOCAL_REDIS_PORT:-6379}:6379
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dinqor-local-redis-data:/data
    networks:
      - dinqor-runtime

  nacos:
    image: ${DINQOR_NACOS_IMAGE:-nacos/nacos-server:v2.5.1}
    container_name: ${DINQOR_LOCAL_NACOS_CONTAINER:-dinqor-local-nacos}
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: ${DINQOR_LOCAL_NACOS_AUTH_ENABLE:-false}
    ports:
      - ${DINQOR_LOCAL_NACOS_PORT:-8848}:8848
      - ${DINQOR_LOCAL_NACOS_GRPC_PORT:-9848}:9848
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    volumes:
      - dinqor-local-nacos-data:/home/nacos/data
      - dinqor-local-nacos-logs:/home/nacos/logs
    networks:
      - dinqor-runtime

  nacos-config-init:
    image: curlimages/curl:8.10.1
    container_name: ${DINQOR_LOCAL_NACOS_CONFIG_INIT_CONTAINER:-dinqor-local-nacos-config-init}
    restart: "no"
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_BASE_URL: http://nacos:8848
      NACOS_NAMESPACE: ${DINQOR_LOCAL_NACOS_NAMESPACE:-dinqor-dev}
    volumes:
      - ../nacos:/config:ro
    command:
      - sh
      - -ec
      - |
        base="$${NACOS_BASE_URL}"
        namespace="$${NACOS_NAMESPACE}"
        namespaces="$$(curl --fail --silent "$${base}/nacos/v1/console/namespaces")"
        if ! printf '%s' "$${namespaces}" | grep -q "\"namespace\":\"$${namespace}\""; then
          curl --fail --silent --show-error -X POST "$${base}/nacos/v1/console/namespaces" \
            --data-urlencode "customNamespaceId=$${namespace}" \
            --data-urlencode "namespaceName=$${namespace}" \
            --data-urlencode "namespaceDesc=DinQorAI local verification namespace"
        fi
        for entry in \
          "dinqor-shared.yaml|COMMON" \
          "dinqor-core.yaml|DINQOR-CORE" \
          "dinqor-gateway.yaml|DINQOR-GATEWAY" \
          "dinqor-bloghtml-preview.yaml|DINQOR-BLOGHTML-PREVIEW" \
          "dinqor-agent.yaml|DINQOR-AGENT" \
          "dinqor-platform-integration.yaml|DINQOR-PLATFORM-INTEGRATION" \
          "dinqor-content-automation.yaml|DINQOR-CONTENT-AUTOMATION"; do
          data_id="$${entry%%|*}"
          group="$${entry##*|}"
          curl --fail --silent --show-error -X POST "$${base}/nacos/v1/cs/configs" \
            --data-urlencode "dataId=$${data_id}" \
            --data-urlencode "group=$${group}" \
            --data-urlencode "tenant=$${namespace}" \
            --data-urlencode "type=yaml" \
            --data-urlencode "content@/config/$${data_id}"
          echo "published $${data_id} ($${group}) into $${namespace}"
        done

volumes:
  dinqor-local-mysql-data:
  dinqor-local-redis-data:
  dinqor-local-nacos-data:
  dinqor-local-nacos-logs:

networks:
  dinqor-runtime:
    name: ${DINQOR_RUNTIME_NETWORK:-dinqor-runtime}
