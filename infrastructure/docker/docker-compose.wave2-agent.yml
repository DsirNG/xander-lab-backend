# V9 §94/§95 — Agent host bootstrap only.
#
# This file deliberately exposes health before business cutover. It must not be
# used to route Agent traffic until the Wave 2 drain checklist in §96 is complete.
services:
  agent:
    image: ${DINQOR_AGENT_IMAGE:-dinqor-agent:wave2}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/agent
        APP_PORT: "30004"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${AGENT_SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: ${AGENT_DB_URL:-jdbc:mysql://mysql:3306/xander_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&connectionTimeZone=Asia%2FShanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${AGENT_DB_USERNAME:-dinqor_agent}
      SPRING_DATASOURCE_PASSWORD: ${AGENT_DB_PASSWORD:-}
      SPRING_REDIS_HOST: ${AGENT_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${AGENT_REDIS_PORT:-6379}
      AGENT_CORE_CLIENT_ENABLED: ${AGENT_CORE_CLIENT_ENABLED:-false}
      AGENT_CORE_BASE_URL: ${AGENT_CORE_BASE_URL:-http://core-host:30002}
      AGENT_CORE_INTERNAL_TOKEN: ${AGENT_CORE_INTERNAL_TOKEN:-}
      AGENT_PLATFORM_CLIENT_ENABLED: ${AGENT_PLATFORM_CLIENT_ENABLED:-false}
      AGENT_PLATFORM_BASE_URL: ${AGENT_PLATFORM_BASE_URL:-http://platform-integration:30005}
      AGENT_PLATFORM_INTERNAL_TOKEN: ${AGENT_PLATFORM_INTERNAL_TOKEN:-}
      AGENT_PLATFORM_CONNECT_TIMEOUT_MILLIS: ${AGENT_PLATFORM_CONNECT_TIMEOUT_MILLIS:-2000}
      AGENT_PLATFORM_READ_TIMEOUT_MILLIS: ${AGENT_PLATFORM_READ_TIMEOUT_MILLIS:-30000}
      AGENT_PLATFORM_MAX_RESPONSE_BYTES: ${AGENT_PLATFORM_MAX_RESPONSE_BYTES:-1048576}
      AGENT_STREAM_DRAIN_ENABLED: ${AGENT_STREAM_DRAIN_ENABLED:-false}
      NACOS_CONFIG_ENABLED: ${AGENT_NACOS_CONFIG_ENABLED:-false}
      NACOS_DISCOVERY_ENABLED: ${AGENT_NACOS_DISCOVERY_ENABLED:-false}
      NACOS_CONFIG_IMPORT_CHECK_ENABLED: ${AGENT_NACOS_CONFIG_IMPORT_CHECK_ENABLED:-false}
    ports:
      - ${AGENT_PORT:-30004}:30004
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:30004/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dinqor-wave2

  platform-integration:
    image: ${DINQOR_PLATFORM_INTEGRATION_IMAGE:-dinqor-platform-integration:wave2}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/platform-integration
        APP_PORT: "30005"
    restart: unless-stopped
    environment:
      SERVER_PORT: 30005
      PLATFORM_INTEGRATION_CORE_BASE_URL: ${PLATFORM_INTEGRATION_CORE_BASE_URL:-http://core-host:30002}
      PLATFORM_INTEGRATION_INTERNAL_API_ENABLED: ${PLATFORM_INTEGRATION_INTERNAL_API_ENABLED:-false}
      PLATFORM_INTEGRATION_INTERNAL_TOKEN: ${PLATFORM_INTEGRATION_INTERNAL_TOKEN:-}
      PLATFORM_INTEGRATION_CORE_INTERNAL_TOKEN: ${PLATFORM_INTEGRATION_CORE_INTERNAL_TOKEN:-${SECURITY_STATE_SYNC_INTERNAL_TOKEN:-}}
      NACOS_CONFIG_ENABLED: ${PLATFORM_INTEGRATION_NACOS_CONFIG_ENABLED:-false}
      NACOS_CONFIG_IMPORT_CHECK_ENABLED: ${PLATFORM_INTEGRATION_NACOS_CONFIG_IMPORT_CHECK_ENABLED:-false}
      NACOS_DISCOVERY_ENABLED: ${PLATFORM_INTEGRATION_NACOS_DISCOVERY_ENABLED:-false}
    ports:
      - ${PLATFORM_INTEGRATION_PORT:-30005}:30005
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:30005/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dinqor-wave2

  content-automation:
    image: ${DINQOR_CONTENT_AUTOMATION_IMAGE:-dinqor-content-automation:wave2}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/content-automation
        APP_PORT: "30006"
    restart: unless-stopped
    environment:
      SERVER_PORT: 30006
      CONTENT_AUTOMATION_CORE_BASE_URL: ${CONTENT_AUTOMATION_CORE_BASE_URL:-http://core-host:30002}
      CONTENT_AUTOMATION_CORE_INTERNAL_TOKEN: ${CONTENT_AUTOMATION_CORE_INTERNAL_TOKEN:-${SECURITY_STATE_SYNC_INTERNAL_TOKEN:-}}
      CONTENT_AUTOMATION_PLATFORM_INTEGRATION_BASE_URL: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_BASE_URL:-http://platform-integration:30005}
      CONTENT_AUTOMATION_PLATFORM_INTEGRATION_INTERNAL_TOKEN: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_INTERNAL_TOKEN:-}
      CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_ENABLED: ${CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_ENABLED:-false}
      CONTENT_AUTOMATION_SECURITY_STATE_CORE_HOST_BASE_URL: ${CONTENT_AUTOMATION_SECURITY_STATE_CORE_HOST_BASE_URL:-http://core-host:30002}
      CONTENT_AUTOMATION_SECURITY_STATE_INTERNAL_TOKEN: ${CONTENT_AUTOMATION_SECURITY_STATE_INTERNAL_TOKEN:-${SECURITY_STATE_SYNC_INTERNAL_TOKEN:-}}
      CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_INTERVAL_MS: ${CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_INTERVAL_MS:-1500}
      CONTENT_AUTOMATION_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS: ${CONTENT_AUTOMATION_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS:-300000}
      CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_BATCH_SIZE: ${CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_BATCH_SIZE:-500}
      CONTENT_AUTOMATION_SECURITY_STATE_REQUEST_TIMEOUT_MS: ${CONTENT_AUTOMATION_SECURITY_STATE_REQUEST_TIMEOUT_MS:-2000}
      CONTENT_AUTOMATION_STREAM_DRAIN_ENABLED: ${CONTENT_AUTOMATION_STREAM_DRAIN_ENABLED:-false}
      CONTENT_AUTOMATION_PLAN_EXECUTOR_ENABLED: ${CONTENT_AUTOMATION_PLAN_EXECUTOR_ENABLED:-false}
      CONTENT_AUTOMATION_PLAN_SCHEDULER_ENABLED: ${CONTENT_AUTOMATION_PLAN_SCHEDULER_ENABLED:-false}
      CONTENT_AUTOMATION_SHEDLOCK_ENABLED: ${CONTENT_AUTOMATION_SHEDLOCK_ENABLED:-false}
      SPRING_DATASOURCE_URL: ${CONTENT_AUTOMATION_DB_URL:-jdbc:mysql://mysql:3306/xander_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&connectionTimeZone=Asia%2FShanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${CONTENT_AUTOMATION_DB_USERNAME:-dinqor_content_automation}
      SPRING_DATASOURCE_PASSWORD: ${CONTENT_AUTOMATION_DB_PASSWORD:-}
      SPRING_REDIS_HOST: ${CONTENT_AUTOMATION_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${CONTENT_AUTOMATION_REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${CONTENT_AUTOMATION_REDIS_PASSWORD:-}
      NACOS_CONFIG_ENABLED: ${CONTENT_AUTOMATION_NACOS_CONFIG_ENABLED:-false}
      NACOS_CONFIG_IMPORT_CHECK_ENABLED: ${CONTENT_AUTOMATION_NACOS_CONFIG_IMPORT_CHECK_ENABLED:-false}
      NACOS_DISCOVERY_ENABLED: ${CONTENT_AUTOMATION_NACOS_DISCOVERY_ENABLED:-false}
    ports:
      - ${CONTENT_AUTOMATION_PORT:-30006}:30006
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:30006/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dinqor-wave2

networks:
  dinqor-wave2:
    name: ${DINQOR_WAVE2_NETWORK:-dinqor-wave2}
