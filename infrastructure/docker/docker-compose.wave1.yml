# V9 §92 — Wave 1 deployment template.
#
# This file is intentionally separate from the historical root docker-compose.yml. The
# latter remains the legacy single-container deployment; this file makes the migration
# order explicit: migration-runner first, then core-host, Gateway and BlogHTML Preview.
# It expects an external Nacos, MySQL and Redis; no infrastructure service is bundled here.
services:
  migration-runner:
    image: ${DINQOR_MIGRATION_IMAGE:-dinqor-migration-runner:wave1}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/migration-runner
        APP_PORT: "0"
    restart: "no"
    env_file:
      - ${BACKEND_ENV_FILE:-../../.env.wave1}
    environment:
      SPRING_PROFILES_ACTIVE: ${MIGRATION_SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: ${MIGRATION_DB_URL:?set MIGRATION_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${MIGRATION_DB_USERNAME:-dinqor_migration}
      SPRING_DATASOURCE_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
    networks:
      - dinqor-wave1

  core-host:
    image: ${DINQOR_CORE_IMAGE:-dinqor-core-host:wave1}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/core-host
        APP_PORT: "30002"
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-../../.env.wave1}
    environment:
      SPRING_PROFILES_ACTIVE: ${CORE_SPRING_PROFILES_ACTIVE:-nacos}
      SPRING_DATASOURCE_URL: ${CORE_DB_URL:?set CORE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${CORE_DB_USERNAME:-dinqor_core}
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD}
      NACOS_CONFIG_ENABLED: "true"
      NACOS_CONFIG_HEALTH_INDICATOR_ENABLED: ${NACOS_CONFIG_HEALTH_INDICATOR_ENABLED:-true}
      NACOS_DISCOVERY_ENABLED: "true"
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:?set NACOS_SERVER_ADDR}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:?set NACOS_NAMESPACE}
      SECURITY_STATE_SYNC_INTERNAL_API_ENABLED: ${SECURITY_STATE_SYNC_INTERNAL_API_ENABLED:-false}
      SECURITY_STATE_SYNC_INTERNAL_TOKEN: ${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-true}
      AUTH_REFRESH_ENABLED: ${AUTH_REFRESH_ENABLED:-false}
      AUTH_REFRESH_ACCESS_TTL_SECONDS: ${AUTH_REFRESH_ACCESS_TTL_SECONDS:-1800}
      AUTH_REFRESH_ENCRYPTION_KEY: ${AUTH_REFRESH_ENCRYPTION_KEY:-}
      AUTH_REFRESH_SECURITY_PUBSUB_ENABLED: ${AUTH_REFRESH_SECURITY_PUBSUB_ENABLED:-false}
      AUTH_REFRESH_SECURITY_PUBSUB_CHANNEL: ${AUTH_REFRESH_SECURITY_PUBSUB_CHANNEL:-dinqor:security-events}
      AGENT_EVENT_BUS_PUBSUB_ENABLED: ${AGENT_EVENT_BUS_PUBSUB_ENABLED:-false}
      AGENT_EVENT_BUS_PUBSUB_CHANNEL: ${AGENT_EVENT_BUS_PUBSUB_CHANNEL:-dinqor:agent-events}
      CORE_STREAM_INSTANCE_ID: ${CORE_STREAM_INSTANCE_ID:-core-host}
      CORE_STREAM_DRAIN_DEADLINE_AT: ${CORE_STREAM_DRAIN_DEADLINE_AT:-0}
    ports:
      - ${CORE_HOST_PORT:-30002}:30002
    depends_on:
      migration-runner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:30002/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dinqor-wave1

  gateway:
    image: ${DINQOR_GATEWAY_IMAGE:-dinqor-gateway:wave1}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/gateway
        APP_PORT: "30000"
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-../../.env.wave1}
    environment:
      SPRING_PROFILES_ACTIVE: ${GATEWAY_SPRING_PROFILES_ACTIVE:-nacos}
      NACOS_CONFIG_ENABLED: "true"
      NACOS_DISCOVERY_ENABLED: "true"
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:?set NACOS_SERVER_ADDR}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:?set NACOS_NAMESPACE}
      GATEWAY_SECURITY_STATE_PUBSUB_ENABLED: ${GATEWAY_SECURITY_STATE_PUBSUB_ENABLED:-false}
      GATEWAY_SECURITY_STATE_PUBSUB_CHANNEL: ${GATEWAY_SECURITY_STATE_PUBSUB_CHANNEL:-dinqor:security-events}
      GATEWAY_SECURITY_STATE_RECONCILE_ENABLED: ${GATEWAY_SECURITY_STATE_RECONCILE_ENABLED:-false}
      GATEWAY_SECURITY_STATE_CORE_HOST_BASE_URL: ${GATEWAY_SECURITY_STATE_CORE_HOST_BASE_URL:-http://core-host:30002}
      GATEWAY_SECURITY_STATE_RECONCILE_INTERVAL_MS: ${GATEWAY_SECURITY_STATE_RECONCILE_INTERVAL_MS:-1500}
      GATEWAY_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS: ${GATEWAY_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS:-300000}
      GATEWAY_SECURITY_STATE_RECONCILE_BATCH_SIZE: ${GATEWAY_SECURITY_STATE_RECONCILE_BATCH_SIZE:-500}
      GATEWAY_SECURITY_STATE_REQUEST_TIMEOUT_MS: ${GATEWAY_SECURITY_STATE_REQUEST_TIMEOUT_MS:-2000}
      SECURITY_STATE_SYNC_INTERNAL_TOKEN: ${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}
      GATEWAY_AGENT_URI: ${GATEWAY_AGENT_URI:-lb://dinqor-agent}
      GATEWAY_AGENT_WS_URI: ${GATEWAY_AGENT_WS_URI:-lb:ws://dinqor-agent}
    ports:
      - ${GATEWAY_PORT:-30000}:30000
    depends_on:
      core-host:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:30000/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dinqor-wave1

  bloghtml-preview:
    image: ${DINQOR_BLOGHTML_IMAGE:-dinqor-bloghtml-preview:wave1}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_MODULE: apps/bloghtml-preview
        APP_PORT: "30003"
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-../../.env.wave1}
    environment:
      SPRING_PROFILES_ACTIVE: ${BLOGHTML_SPRING_PROFILES_ACTIVE:-nacos}
      NACOS_CONFIG_ENABLED: "true"
      NACOS_DISCOVERY_ENABLED: "true"
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:?set NACOS_SERVER_ADDR}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:?set NACOS_NAMESPACE}
    ports:
      - ${BLOGHTML_PORT:-30003}:30003
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:30003/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dinqor-wave1

networks:
  dinqor-wave1:
    driver: bridge
