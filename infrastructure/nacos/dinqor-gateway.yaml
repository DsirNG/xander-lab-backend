# V9 §16 — service-private Nacos DataId: dinqor-gateway.yaml / DINQOR-GATEWAY.
spring:
  application:
    name: dinqor-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
      default-filters:
        - PreserveHostHeader
      routes:
        - id: monolith-fallback
          uri: lb://dinqor-core-host
          predicates:
            - Path=/**
          filters:
            - AddResponseHeader=X-Accel-Buffering, no
          order: 9999
    nacos:
      discovery:
        enabled: true
        group: ${NACOS_DISCOVERY_GROUP:COMMON}
        service: dinqor-gateway

gateway:
  # Route destinations belong to the Gateway private DataId so a production
  # cutover does not depend on values baked into the application jar.
  agent-uri: ${GATEWAY_AGENT_URI:lb://dinqor-agent}
  agent-ws-uri: ${GATEWAY_AGENT_WS_URI:lb:ws://dinqor-agent}
  platform-integration-uri: ${GATEWAY_PLATFORM_INTEGRATION_URI:lb://dinqor-platform-integration}
  content-automation-uri: ${GATEWAY_CONTENT_AUTOMATION_URI:lb://dinqor-content-automation}
  stream-proxy:
    preserve-response-header: X-Accel-Buffering
    preserve-request-header: Last-Event-ID
    websocket-upgrade: true
    response-timeout: disabled
  # Enable together with CONTENT_AUTOMATION_PUBLISHING_CREATE_ENABLED after staging.
  content-publishing-create-enabled: false
  security-state:
    pubsub-enabled: ${GATEWAY_SECURITY_STATE_PUBSUB_ENABLED:false}
    pubsub-channel: ${GATEWAY_SECURITY_STATE_PUBSUB_CHANNEL:dinqor:security-events}
    reconcile-enabled: ${GATEWAY_SECURITY_STATE_RECONCILE_ENABLED:false}
    core-host-base-url: ${GATEWAY_SECURITY_STATE_CORE_HOST_BASE_URL:http://core-host:30002}
    internal-token: ${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}
    reconcile-interval-ms: ${GATEWAY_SECURITY_STATE_RECONCILE_INTERVAL_MS:1500}
    full-reconcile-interval-ms: ${GATEWAY_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS:300000}
    reconcile-batch-size: ${GATEWAY_SECURITY_STATE_RECONCILE_BATCH_SIZE:500}
    request-timeout-ms: ${GATEWAY_SECURITY_STATE_REQUEST_TIMEOUT_MS:2000}
