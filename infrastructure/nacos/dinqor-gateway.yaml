# V9 §16 — service-private Nacos DataId: dinqor-gateway.yaml / DINQOR-GATEWAY.
spring:
  application:
    name: dinqor-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        # Streaming routes must not be cut off by the normal request timeout.
        response-timeout: -1ms
      default-filters:
        - PreserveHostHeader
      routes:
        - id: monolith-fallback
          uri: lb://dinqor-core-host
          predicates:
            - Path=/**
          filters:
            - AddResponseHeader=X-Accel-Buffering, no
          order: 9999
    nacos:
      discovery:
        enabled: true
        group: DINQOR-GATEWAY
        service: dinqor-gateway

gateway:
  stream-proxy:
    preserve-response-header: X-Accel-Buffering
    preserve-request-header: Last-Event-ID
    websocket-upgrade: true
    response-timeout: disabled
