# V9 §16 — service-private Nacos DataId: dinqor-core.yaml / DINQOR-CORE.
spring:
  application:
    name: dinqor-core-host
  datasource:
    # The password remains an environment/deployment Secret.
    username: ${SPRING_DATASOURCE_USERNAME:dinqor_core}
  flyway:
    enabled: false
  cloud:
    nacos:
      discovery:
        enabled: true
        group: ${NACOS_DISCOVERY_GROUP:COMMON}
        service: dinqor-core-host
mybatis-plus:
  # Production service-private config must not swallow mapper XML from another jar.
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.xander.lab.automation.domain,com.xander.lab.studio.domain,com.xander.lab.billing.domain

security:
  state-sync:
    internal-api-enabled: ${SECURITY_STATE_SYNC_INTERNAL_API_ENABLED:false}
    internal-token: ${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}

mysql:
  reliability:
    enabled: ${MYSQL_RELIABILITY_ENABLED:false}
    evidence-file: ${MYSQL_RELIABILITY_EVIDENCE_FILE:}
    refresh-interval-ms: ${MYSQL_RELIABILITY_REFRESH_INTERVAL_MS:30000}
