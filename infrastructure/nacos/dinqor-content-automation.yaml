# V9 §16 — service-private DataId: dinqor-content-automation.yaml / DINQOR-CONTENT-AUTOMATION.
# Secrets and database passwords stay in deployment environment variables.
spring:
  application:
    name: dinqor-content-automation
  cloud:
    nacos:
      discovery:
        enabled: true
        group: ${NACOS_DISCOVERY_GROUP:COMMON}
        service: dinqor-content-automation

content-automation:
  core-base-url: ${CONTENT_AUTOMATION_CORE_BASE_URL:http://dinqor-core-host:30002}
  core-internal-token: ${CONTENT_AUTOMATION_CORE_INTERNAL_TOKEN:}
  core-connect-timeout-millis: ${CONTENT_AUTOMATION_CORE_CONNECT_TIMEOUT_MILLIS:2000}
  core-read-timeout-millis: ${CONTENT_AUTOMATION_CORE_READ_TIMEOUT_MILLIS:15000}
  core-max-response-bytes: ${CONTENT_AUTOMATION_CORE_MAX_RESPONSE_BYTES:1048576}
  publishing-create-enabled: false
  platform-integration-base-url: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_BASE_URL:http://dinqor-platform-integration:30005}
  platform-integration-internal-token: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_INTERNAL_TOKEN:}
  platform-integration-connect-timeout-millis: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_CONNECT_TIMEOUT_MILLIS:2000}
  platform-integration-read-timeout-millis: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_READ_TIMEOUT_MILLIS:30000}
  platform-integration-max-response-bytes: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_MAX_RESPONSE_BYTES:1048576}
  model-timeout-millis: ${CONTENT_AUTOMATION_MODEL_TIMEOUT_MILLIS:30000}
  security-state:
    reconcile-enabled: ${CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_ENABLED:true}
    core-host-base-url: ${CONTENT_AUTOMATION_SECURITY_STATE_CORE_HOST_BASE_URL:${CONTENT_AUTOMATION_CORE_BASE_URL:http://dinqor-core-host:30002}}
    internal-token: ${CONTENT_AUTOMATION_SECURITY_STATE_INTERNAL_TOKEN:${CONTENT_AUTOMATION_CORE_INTERNAL_TOKEN:}}
    reconcile-interval-ms: ${CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_INTERVAL_MS:1500}
    full-reconcile-interval-ms: ${CONTENT_AUTOMATION_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS:300000}
    reconcile-batch-size: ${CONTENT_AUTOMATION_SECURITY_STATE_RECONCILE_BATCH_SIZE:500}
    request-timeout-ms: ${CONTENT_AUTOMATION_SECURITY_STATE_REQUEST_TIMEOUT_MS:2000}
  stream-drain-enabled: ${CONTENT_AUTOMATION_STREAM_DRAIN_ENABLED:false}
  stream-instance-id: ${CONTENT_AUTOMATION_STREAM_INSTANCE_ID:${HOSTNAME:unknown}}
  stream-drain-deadline-at: ${CONTENT_AUTOMATION_STREAM_DRAIN_DEADLINE_AT:0}
  stream-drain-check-interval-ms: ${CONTENT_AUTOMATION_STREAM_DRAIN_CHECK_INTERVAL_MS:1000}
  shedlock:
    enabled: false
  plan-executor:
    enabled: false
  plan-scheduler:
    enabled: false
    batch-size: ${CONTENT_AUTOMATION_PLAN_SCHEDULER_BATCH_SIZE:5}
    claim-timeout-ms: ${CONTENT_AUTOMATION_PLAN_SCHEDULER_CLAIM_TIMEOUT_MS:1800000}
    poll-interval-ms: ${CONTENT_AUTOMATION_PLAN_SCHEDULER_POLL_INTERVAL_MS:15000}
    initial-delay-ms: ${CONTENT_AUTOMATION_PLAN_SCHEDULER_INITIAL_DELAY_MS:15000}
  email-reminder-scheduler:
    enabled: false
    batch-size: ${CONTENT_AUTOMATION_EMAIL_REMINDER_SCHEDULER_BATCH_SIZE:20}
    claim-timeout-ms: ${CONTENT_AUTOMATION_EMAIL_REMINDER_SCHEDULER_CLAIM_TIMEOUT_MS:600000}
    max-send-attempts: ${CONTENT_AUTOMATION_EMAIL_REMINDER_SCHEDULER_MAX_SEND_ATTEMPTS:3}
    retry-delay-ms: ${CONTENT_AUTOMATION_EMAIL_REMINDER_SCHEDULER_RETRY_DELAY_MS:30000}
    poll-interval-ms: ${CONTENT_AUTOMATION_EMAIL_REMINDER_SCHEDULER_POLL_INTERVAL_MS:10000}
    initial-delay-ms: ${CONTENT_AUTOMATION_EMAIL_REMINDER_SCHEDULER_INITIAL_DELAY_MS:15000}
    display-zone: ${CONTENT_AUTOMATION_EMAIL_REMINDER_DISPLAY_ZONE:Asia/Shanghai}
