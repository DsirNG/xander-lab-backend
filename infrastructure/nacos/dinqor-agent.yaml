# V9 §16 — service-private DataId: dinqor-agent.yaml / DINQOR-AGENT.
# Secrets and database passwords stay in deployment environment variables.
spring:
  application:
    name: dinqor-agent
  cloud:
    nacos:
      discovery:
        enabled: true
        group: DINQOR-AGENT
        service: dinqor-agent

agent:
  core-client:
    enabled: ${AGENT_CORE_CLIENT_ENABLED:true}
    base-url: ${AGENT_CORE_BASE_URL:http://dinqor-core-host:30002}
    internal-token: ${AGENT_CORE_INTERNAL_TOKEN:}
  platform-client:
    enabled: ${AGENT_PLATFORM_CLIENT_ENABLED:true}
    base-url: ${AGENT_PLATFORM_BASE_URL:http://dinqor-platform-integration:30005}
    internal-token: ${AGENT_PLATFORM_INTERNAL_TOKEN:}
    connect-timeout-millis: ${AGENT_PLATFORM_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${AGENT_PLATFORM_READ_TIMEOUT_MILLIS:30000}
    max-response-bytes: ${AGENT_PLATFORM_MAX_RESPONSE_BYTES:1048576}
  security-state:
    reconcile-enabled: ${AGENT_SECURITY_STATE_RECONCILE_ENABLED:true}
    core-host-base-url: ${AGENT_SECURITY_STATE_CORE_HOST_BASE_URL:http://dinqor-core-host:30002}
    internal-token: ${AGENT_SECURITY_STATE_INTERNAL_TOKEN:${AGENT_CORE_INTERNAL_TOKEN:}}
    reconcile-interval-ms: ${AGENT_SECURITY_STATE_RECONCILE_INTERVAL_MS:1500}
    full-reconcile-interval-ms: ${AGENT_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS:300000}
    reconcile-batch-size: ${AGENT_SECURITY_STATE_RECONCILE_BATCH_SIZE:500}
    request-timeout-ms: ${AGENT_SECURITY_STATE_REQUEST_TIMEOUT_MS:2000}
  stream:
    drain-enabled: ${AGENT_STREAM_DRAIN_ENABLED:false}
