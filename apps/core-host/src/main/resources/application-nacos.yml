# V9 §16 / §17 — opt-in production configuration import.
# Local development stays on application.yml; activate this profile only when Nacos is reachable.
spring:
  config:
    import:
      - "nacos:dinqor-shared.yaml?group=COMMON"
      - "nacos:dinqor-core.yaml?group=DINQOR-CORE"
  datasource:
    # Wave 1 runtime account; the password is deployment-only and never belongs in Nacos.
    username: ${SPRING_DATASOURCE_USERNAME:dinqor_core}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        import-check:
          enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-CORE}
        file-extension: yaml
      discovery:
        enabled: true
