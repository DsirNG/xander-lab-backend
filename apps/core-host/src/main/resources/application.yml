server:
  port: 30002

core:
  stream:
    drain-enabled: ${CORE_STREAM_DRAIN_ENABLED:false}
    instance-id: ${CORE_STREAM_INSTANCE_ID:${HOSTNAME:unknown}}
    drain-deadline-at: ${CORE_STREAM_DRAIN_DEADLINE_AT:0}

spring:
  config:
    import: optional:application-local.yml
  application:
    name: ${SPRING_APPLICATION_NAME:dinqorai-backend}
  # DDL belongs to the standalone migration-runner, never to a business service.
  flyway:
    enabled: false
  cloud:
    nacos:
      config:
        # The default profile is local and does not import Nacos. The nacos profile
        # supplies the actual required nacos: locations.
        enabled: ${NACOS_CONFIG_ENABLED:false}
        health-indicator-enabled: ${NACOS_CONFIG_HEALTH_INDICATOR_ENABLED:false}
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:COMMON}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xander_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&connectionTimeZone=Asia%2FShanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 远程 MySQL/代理可能提前关闭空闲连接（本地日志曾见
    # "No operations allowed after connection closed"），缩短连接最大存活时间
    # 并定期探测，避免整个连接池失效后所有定时任务停止。
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 600000
      keepalive-time: 300000
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 5000ms

  # 邮件配置
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: false

# Redis 可用性告警：默认关闭，生产环境显式配置收件人后开启。
redis-monitor:
  enabled: ${REDIS_MONITOR_ENABLED:false}
  recipient: ${REDIS_MONITOR_RECIPIENT:}
  poll-interval-ms: ${REDIS_MONITOR_POLL_INTERVAL_MS:30000}
  initial-delay-ms: ${REDIS_MONITOR_INITIAL_DELAY_MS:30000}
  failure-threshold: ${REDIS_MONITOR_FAILURE_THRESHOLD:2}
  notify-recovery: ${REDIS_MONITOR_NOTIFY_RECOVERY:true}
  alert-retry-interval-ms: ${REDIS_MONITOR_ALERT_RETRY_INTERVAL_MS:300000}

mysql:
  reliability:
    enabled: ${MYSQL_RELIABILITY_ENABLED:false}
    evidence-file: ${MYSQL_RELIABILITY_EVIDENCE_FILE:}
    refresh-interval-ms: ${MYSQL_RELIABILITY_REFRESH_INTERVAL_MS:30000}

mail:
  from: ${MAIL_FROM:noreply@mail.dsircity.top}

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:your_access_key_id}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:your_access_key_secret}
    bucketName: food-cinder
    domain: https://food-cinder.oss-cn-beijing.aliyuncs.com
    # 文件上传限制
    upload:
      avatar:
        maxSize: 10485760  # 10MB
        allowedTypes: jpg,jpeg,png,gif
        pathPrefix: avatars/
      photo:
        maxSize: 20971520  # 20MB
        allowedTypes: jpg,jpeg,png,gif,webp
        pathPrefix: photos/
      video:
        maxSize: 104857600  # 100MB
        allowedTypes: mp4,avi,mov
        pathPrefix: videos/

# CORS 允许的前端来源（逗号分隔）；未配置时使用 * 放行所有来源。
# 配置具体域名后按白名单放行（含 nginx 反代时的浏览器 Origin）。
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# V9 §80「MyBatis 配置分片」的当前状态与 Wave 1 的处置：
#
#   mapper-locations 用的是 classpath*:/mapper/*.xml，正是 §80 明令禁止的「全局吞入」。
#   本地默认配置仍保留它：全仓只有一个应用模块，classpath 上没有别人的 mapper 可吞，
#   也让不启用 Nacos 的开发环境保持可运行。生产的 nacos profile 通过
#   infrastructure/nacos/dinqor-core.yaml 覆盖为 classpath:/mapper/*.xml，
#   只加载 core-host 自己的 mapper；门禁同时检查这个生产覆盖。
#
#   type-aliases-package 原本第一项是 com.xander.lab.entity，该包并不存在（旧式分层
#   遗留的空目录），已删除。剩下三项是真实域包，但当前唯一一份 mapper XML
#   （mapper/BlogPostMapper.xml）通篇使用全限定类名，因此这个属性目前整体未被使用。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.xander.lab.automation.domain,com.xander.lab.studio.domain,com.xander.lab.billing.domain

# JWT配置
jwt:
  # 必须通过环境变量 JWT_SECRET 注入（至少 32 字节），缺省时启动会失败
  secret: ${JWT_SECRET:}
  # 登录有效期一周（毫秒）
  access-token-expire: 604800000
  refresh-token-expire: 2592000000

# 多实例安全事件快路径：默认关闭；所有 core-host 实例必须一起开启。
auth:
  refresh:
    # 新 Refresh Session 协议默认关闭；切流前必须先完成 Wave 2 客户端联调。
    enabled: ${AUTH_REFRESH_ENABLED:false}
    access-ttl-seconds: ${AUTH_REFRESH_ACCESS_TTL_SECONDS:1800}
    encryption-key: ${AUTH_REFRESH_ENCRYPTION_KEY:}
    security-pubsub-enabled: ${AUTH_REFRESH_SECURITY_PUBSUB_ENABLED:false}
    security-pubsub-channel: ${AUTH_REFRESH_SECURITY_PUBSUB_CHANNEL:dinqor:security-events}

# Gateway 安全状态快照/增量同步 API：默认关闭，开启时必须注入共享内部令牌。
security:
  state-sync:
    internal-api-enabled: ${SECURITY_STATE_SYNC_INTERNAL_API_ENABLED:false}
    internal-token: ${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}

# Integration publication bridge: disabled by default and kept separate from identity's
# security-state properties so the deployment boundary does not import identity configuration.
integration:
  internal:
    api-enabled: ${INTEGRATION_INTERNAL_API_ENABLED:${SECURITY_STATE_SYNC_INTERNAL_API_ENABLED:false}}
    internal-token: ${INTEGRATION_INTERNAL_TOKEN:${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}}

# Disabled by default. Use a Base64-encoded 32-byte key, and keep the server token out of source control.
mcp:
  oauth:
    enabled: ${MCP_OAUTH_ENABLED:false}
    public-base-url: ${MCP_PUBLIC_BASE_URL:http://localhost:30002}
    authorization-request-ttl-seconds: ${MCP_OAUTH_AUTHORIZATION_REQUEST_TTL_SECONDS:600}
    authorization-code-ttl-seconds: ${MCP_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS:300}
    access-token-ttl-seconds: ${MCP_OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-seconds: ${MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
    # Fixed-window Redis rate limit per caller for /register, /authorize, consent and /token.
    rate-limit-max-requests: ${MCP_OAUTH_RATE_LIMIT_MAX_REQUESTS:20}
    rate-limit-window-seconds: ${MCP_OAUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  blog:
    enabled: ${MCP_BLOG_ENABLED:false}
  csdn:
    enabled: ${MCP_CSDN_ENABLED:false}
    platform:
      enabled: ${CSDN_PUBLISH_ENABLED:false}
      base-url: ${CSDN_API_BASE_URL:https://bizapi.csdn.net}
      api-key: ${CSDN_API_KEY:}
      selenium-url: ${CSDN_SELENIUM_URL:http://selenium:4444/wd/hub}
      credential-encryption-key: ${CSDN_CREDENTIAL_ENCRYPTION_KEY:}
      # CSDN web-console 签名密钥（其前端公开常量，可覆盖以支持轮换）
      web-console-secret: ${CSDN_WEB_CONSOLE_SECRET:9znpamsyl2c7cdrr9sas0le9vbc3r6ba}
      # Hard session limit; the frontend shows the QR for a shorter window (minus a buffer) and cancels on its own.
      authorization-timeout-seconds: ${CSDN_AUTHORIZATION_TIMEOUT_SECONDS:35}
  dual:
    enabled: ${MCP_DUAL_ENABLED:false}
  juejin:
    enabled: ${MCP_JUEJIN_ENABLED:false}
    platform:
      enabled: ${JUEJIN_PUBLISH_ENABLED:false}
      base-url: ${JUEJIN_API_BASE_URL:https://api.juejin.cn}
      default-aid: ${JUEJIN_DEFAULT_AID:2608}
      credential-encryption-key: ${JUEJIN_CREDENTIAL_ENCRYPTION_KEY:}
      connect-timeout-millis: ${JUEJIN_CONNECT_TIMEOUT_MILLIS:10000}
      read-timeout-millis: ${JUEJIN_READ_TIMEOUT_MILLIS:30000}
      catalog-freshness-hours: ${JUEJIN_CATALOG_FRESHNESS_HOURS:24}
  # 出站 MCP 客户端：让智能体连接第三方 MCP 服务器，把对方的工具并进工具面。
  # 与服务端那套（mcp.oauth / mcp.blog / mcp.csdn …）是彼此独立的两套开关，互不影响。
  # 开启前必须先应用 db/20260914_agent_mcp_client_migration.sql。
  client:
    enabled: ${MCP_CLIENT_ENABLED:false}
    # Base64 编码的 32 字节 AES 密钥，用于加密远端服务器的请求头凭据。启用时必填。
    credential-encryption-key: ${MCP_CLIENT_CREDENTIAL_ENCRYPTION_KEY:}
    connect-timeout-seconds: ${MCP_CLIENT_CONNECT_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${MCP_CLIENT_REQUEST_TIMEOUT_SECONDS:30}
    max-tools-per-server: ${MCP_CLIENT_MAX_TOOLS_PER_SERVER:50}
    max-description-length: ${MCP_CLIENT_MAX_DESCRIPTION_LENGTH:400}
    max-result-length: ${MCP_CLIENT_MAX_RESULT_LENGTH:8000}

# 管理台模型网关：关闭时各功能继续使用下方环境变量配置；开启前必须先应用 db 迁移 SQL。
admin:
  model-gateway:
    enabled: ${ADMIN_MODEL_GATEWAY_ENABLED:false}
    # Base64 编码的 32 字节 AES 密钥，用于加密 model_provider 的 API 密钥静态存储。
    encryption-key: ${MODEL_PROVIDER_ENCRYPTION_KEY:}

# 中文背诵录音转写。先应用 recitation_migration.sql，并在管理台配置 recitation_asr 后再启用。
recitation:
  enabled: ${RECITATION_ENABLED:false}
  max-audio-bytes: ${RECITATION_MAX_AUDIO_BYTES:20971520}
  worker-batch-size: ${RECITATION_WORKER_BATCH_SIZE:10}
  worker-poll-interval-ms: ${RECITATION_WORKER_POLL_INTERVAL_MS:2000}
  stale-claim-seconds: ${RECITATION_STALE_CLAIM_SECONDS:120}

# Leave credentials in application-local.yml or environment variables; never commit them.
# 微信小程序登录通道：AppID/AppSecret 由管理台加密维护（wechat_credential 表），
# 此处仅保留接口地址、超时与凭据加密密钥来源。
wechat:
  credential:
    # Base64 编码的 32 字节 AES 密钥，用于加密 wechat_credential 表的 AppSecret 静态存储。
    encryption-key: ${WECHAT_CREDENTIAL_ENCRYPTION_KEY:}
  miniapp:
    code-2-session-url: ${WECHAT_MINI_CODE_2_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}

# Wave 1 operational endpoints. Prometheus is exposed for the platform network;
# application-level authorization remains the responsibility of the deployment edge.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}
    connect-timeout-millis: ${WECHAT_MINI_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${WECHAT_MINI_READ_TIMEOUT_MILLIS:5000}
    # 二维码使用的版本：develop（开发版）、trial（体验版）、release（正式版）
    env-version: ${WECHAT_MINI_ENV_VERSION:trial}
  # OfferID、AppKey、开关与商品由管理台加密入库；消息 Token 仍来自服务器环境变量。
  virtual-pay:
    message-token: ${WECHAT_VIRTUAL_PAY_MESSAGE_TOKEN:}
    api-base-url: ${WECHAT_VIRTUAL_PAY_API_BASE_URL:https://api.weixin.qq.com}
    connect-timeout-millis: ${WECHAT_VIRTUAL_PAY_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${WECHAT_VIRTUAL_PAY_READ_TIMEOUT_MILLIS:10000}

agent:
  event-bus:
    pubsub-enabled: ${AGENT_EVENT_BUS_PUBSUB_ENABLED:false}
    pubsub-channel: ${AGENT_EVENT_BUS_PUBSUB_CHANNEL:dinqor:agent-events}
  conversation:
    max-steps: ${AGENT_CONVERSATION_MAX_STEPS:20}
    max-tool-failures: ${AGENT_CONVERSATION_MAX_TOOL_FAILURES:2}
    stale-conversation-minutes: ${AGENT_CONVERSATION_STALE_MINUTES:30}
    # 只是一道兜底闸门，不再决定"模型记得什么"——那件事归压缩。
    # 早先是 30 且没有压缩：第 31 条一到前面的消息就无声无息地没了，
    # 而 30 条又几乎撑不到 token 阈值，压缩即使写好了也永远不会触发。
    context-message-limit: ${AGENT_CONVERSATION_CONTEXT_MESSAGE_LIMIT:120}
    compaction-enabled: ${AGENT_CONVERSATION_COMPACTION_ENABLED:true}
    # 模型服务是管理员配置的第三方端点，拿不到它的真实窗口，只能由部署方声明。
    # 换成更小窗口的模型时必须调小它，否则压缩会来得太晚。
    context-window-tokens: ${AGENT_CONVERSATION_CONTEXT_WINDOW_TOKENS:128000}
    compaction-threshold-ratio: ${AGENT_CONVERSATION_COMPACTION_THRESHOLD_RATIO:0.8}
    compaction-retain-ratio: ${AGENT_CONVERSATION_COMPACTION_RETAIN_RATIO:0.16}
    # 一步里最多执行几个工具调用。模型可以一次报出多个互不依赖的查询，一步全做完，省掉往返步数。
    # 上限是资源闸门：一次报二十个查询会把步数预算一步烧光。超出的调用会以"未执行"写回历史，
    # 模型下一步可以重新发起——不会被静默丢掉。
    max-parallel-tools: ${AGENT_CONVERSATION_MAX_PARALLEL_TOOLS:4}
  model:
    # Dedicated variables take precedence; blog-agent variables remain a deployment-compatible fallback.
    base-url: ${AGENT_MODEL_BASE_URL:${BLOG_AGENT_BASE_URL:https://api.openai.com/v1}}
    api-key: ${AGENT_MODEL_API_KEY:${BLOG_AGENT_API_KEY:}}
    model: ${AGENT_MODEL:${BLOG_AGENT_MODEL:}}
    web-search-enabled: ${AGENT_MODEL_WEB_SEARCH_ENABLED:${BLOG_AGENT_WEB_SEARCH_ENABLED:true}}
    reasoning-effort: ${AGENT_MODEL_REASONING_EFFORT:low}
    connect-timeout-millis: ${AGENT_MODEL_CONNECT_TIMEOUT_MILLIS:15000}
    # 流式读取的"两次数据之间"上限，非整轮上限。上游卡死时靠它尽早换供应商，
    # 而不是等到网关层 25 秒后吐 524。原先 300000 会让单端点最长静默 5 分钟。
    read-timeout-millis: ${AGENT_MODEL_READ_TIMEOUT_MILLIS:60000}

blog:
  agent:
    base-url: ${BLOG_AGENT_BASE_URL:https://api.openai.com/v1}
    api-key: ${BLOG_AGENT_API_KEY:}
    model: ${BLOG_AGENT_MODEL:}
    web-search-enabled: ${BLOG_AGENT_WEB_SEARCH_ENABLED:true}
    connect-timeout-millis: ${BLOG_AGENT_CONNECT_TIMEOUT_MILLIS:15000}
    read-timeout-millis: ${BLOG_AGENT_READ_TIMEOUT_MILLIS:300000}
    image-model: ${BLOG_AGENT_IMAGE_MODEL:}
    image-size: ${BLOG_AGENT_IMAGE_SIZE:1536x1024}
    max-illustrations: ${BLOG_AGENT_MAX_ILLUSTRATIONS:3}
    stale-task-minutes: ${BLOG_AGENT_STALE_TASK_MINUTES:30}

# Image → procedural Three.js.
# 凭证回落写在**配置层**（下面三个嵌套占位符），不是在代码里读 blogagent 的配置 bean ——
# 见 docs/migration/adr-contract-boundaries.md §17。
img2three:
  pipeline-enabled: ${IMG2THREE_PIPELINE_ENABLED:true}
  pipeline-root: ${IMG2THREE_PIPELINE_ROOT:plugins/img2threejs}
  # Blank auto-detects a working Python 3 command (python on Windows, python3 on Linux).
  python-command: ${IMG2THREE_PYTHON_COMMAND:}
  agent:
    # Deterministic local reconstruction is the default; remote vision is explicit opt-in.
    enabled: ${IMG2THREE_AGENT_ENABLED:false}
    # 回落的是 blog.agent 的**属性值**（不是环境变量名），所以 application-local.yml 里
    # 直接写 blog.agent.* 也能被回落到，行为与改造前逐字一致。
    base-url: ${IMG2THREE_AGENT_BASE_URL:${blog.agent.base-url:}}
    api-key: ${IMG2THREE_AGENT_API_KEY:${blog.agent.api-key:}}
    model: ${IMG2THREE_AGENT_MODEL:${blog.agent.model:}}

# The database migration must be applied before enabling the scheduler.
email-reminder:
  enabled: ${EMAIL_REMINDER_ENABLED:true}
  poll-interval-ms: ${EMAIL_REMINDER_POLL_INTERVAL_MS:10000}
  initial-delay-ms: ${EMAIL_REMINDER_INITIAL_DELAY_MS:1000}
  claim-timeout-ms: ${EMAIL_REMINDER_CLAIM_TIMEOUT_MS:600000}
  batch-size: ${EMAIL_REMINDER_BATCH_SIZE:20}
  max-send-attempts: ${EMAIL_REMINDER_MAX_SEND_ATTEMPTS:3}
  retry-delay-ms: ${EMAIL_REMINDER_RETRY_DELAY_MS:30000}
  minimum-lead-seconds: ${EMAIL_REMINDER_MINIMUM_LEAD_SECONDS:30}
  max-active-per-user: ${EMAIL_REMINDER_MAX_ACTIVE_PER_USER:50}
  max-created-per-day: ${EMAIL_REMINDER_MAX_CREATED_PER_DAY:20}
  display-zone: ${EMAIL_REMINDER_DISPLAY_ZONE:Asia/Shanghai}

# Daily content plans (automatic generation + publishing). The database migration
# must be applied before enabling the scheduler.
blog-content-plan:
  enabled: ${BLOG_CONTENT_PLAN_ENABLED:false}
  poll-interval-ms: ${BLOG_CONTENT_PLAN_POLL_INTERVAL_MS:15000}
  initial-delay-ms: ${BLOG_CONTENT_PLAN_INITIAL_DELAY_MS:1000}
  claim-timeout-ms: ${BLOG_CONTENT_PLAN_CLAIM_TIMEOUT_MS:1800000}
  batch-size: ${BLOG_CONTENT_PLAN_BATCH_SIZE:5}
  max-active-per-user: ${BLOG_CONTENT_PLAN_MAX_ACTIVE_PER_USER:50}
  max-created-per-day: ${BLOG_CONTENT_PLAN_MAX_CREATED_PER_DAY:20}

# Points billing module. 账本单位为「毫分」（1 分 = 1000 毫分），余额与流水全链路毫分。
# token 单价以「毫分 / 每 1K token」为单位（500 = 每 1K 输入 token 折 0.5 分），
# token 计费精确到毫分、至少 1 毫分；flat 为无 token 计量项的一口价（单位：毫分）。
# 支持按模型配置不同价格：数据库 billing_model_price 优先，其次 models.{model}.price，最后默认 price。
billing:
  enabled: ${BILLING_ENABLED:true}
  grant-register: ${BILLING_GRANT_REGISTER:2000000}
  pre-check-min-balance: ${BILLING_PRE_CHECK_MIN_BALANCE:1000}
  price:
    input-milli-per-1k-token: ${BILLING_INPUT_MILLI_PER_1K_TOKEN:50}
    output-milli-per-1k-token: ${BILLING_OUTPUT_MILLI_PER_1K_TOKEN:200}
    cached-milli-per-1k-token: ${BILLING_CACHED_MILLI_PER_1K_TOKEN:5}
  models:
    gpt-5.6-terra:
      price:
        input-milli-per-1k-token: ${BILLING_MODEL_GPT56_TERRA_INPUT:20}
        output-milli-per-1k-token: ${BILLING_MODEL_GPT56_TERRA_OUTPUT:120}
        cached-milli-per-1k-token: ${BILLING_MODEL_GPT56_TERRA_CACHED:2}
      cached-write-milli-per-1k-token: ${BILLING_MODEL_GPT56_TERRA_CACHED_WRITE:25}
    gpt-image-2:
      price:
        input-milli-per-1k-token: ${BILLING_MODEL_GPT_IMAGE2_INPUT:50}
        output-milli-per-1k-token: ${BILLING_MODEL_GPT_IMAGE2_OUTPUT:300}
        cached-milli-per-1k-token: ${BILLING_MODEL_GPT_IMAGE2_CACHED:0}
  flat:
    email-reminder: ${BILLING_FLAT_EMAIL_REMINDER:5000}
    csdn-publish: ${BILLING_FLAT_CSDN_PUBLISH:10000}
    juejin-publish: ${BILLING_FLAT_JUEJIN_PUBLISH:10000}


# 知识库文件中心。上传大小上限受 spring.servlet.multipart 约束，两处要一起改。
# reaper 会删本地暂存目录里的文件，默认关闭，由部署方显式打开。
knowledge-base:
  max-folder-depth: ${KNOWLEDGE_BASE_MAX_FOLDER_DEPTH:8}
  max-folders: ${KNOWLEDGE_BASE_MAX_FOLDERS:2000}
  max-file-bytes: ${KNOWLEDGE_BASE_MAX_FILE_BYTES:52428800}
  max-extract-chars: ${KNOWLEDGE_BASE_MAX_EXTRACT_CHARS:2000000}
  max-chapters: ${KNOWLEDGE_BASE_MAX_CHAPTERS:2000}
  # 章节数超过阈值或正文超过字数上限时不整本出结构图，改为发通知、按章按需生成。
  auto-structure-chapter-threshold: ${KNOWLEDGE_BASE_AUTO_STRUCTURE_CHAPTER_THRESHOLD:12}
  auto-structure-max-chars: ${KNOWLEDGE_BASE_AUTO_STRUCTURE_MAX_CHARS:200000}
  max-points-per-node: ${KNOWLEDGE_BASE_MAX_POINTS_PER_NODE:8}
  summary-length: ${KNOWLEDGE_BASE_SUMMARY_LENGTH:200}
  max-auto-tags: ${KNOWLEDGE_BASE_MAX_AUTO_TAGS:5}
  max-tags: ${KNOWLEDGE_BASE_MAX_TAGS:500}
  chunk-staging-dir: ${KNOWLEDGE_BASE_CHUNK_STAGING_DIR:data/knowledge-base/chunks}
  min-chunk-size: ${KNOWLEDGE_BASE_MIN_CHUNK_SIZE:262144}
  max-chunk-size: ${KNOWLEDGE_BASE_MAX_CHUNK_SIZE:16777216}
  session-ttl-hours: ${KNOWLEDGE_BASE_SESSION_TTL_HOURS:24}
  reaper-enabled: ${KNOWLEDGE_BASE_REAPER_ENABLED:false}
  reaper-batch-size: ${KNOWLEDGE_BASE_REAPER_BATCH_SIZE:50}
  reaper-interval-ms: ${KNOWLEDGE_BASE_REAPER_INTERVAL_MS:3600000}
  reaper-initial-delay-ms: ${KNOWLEDGE_BASE_REAPER_INITIAL_DELAY_MS:60000}


# 多实例定时任务互斥（V9 §67 / §68 / §69）。
# 默认关闭：Wave 0A 是单实例部署，现有 DB 原子领取已保证"恰好一次"，
# 加锁只会多一个失败点（锁表缺失 / 锁未释放）。扩到多实例时再打开，
# 打开前必须确认 shedlock 表已由 migration 账号建好，且每个 @SchedulerLock
# 的 lockAtMostFor 大于该任务的最坏运行时长。
# 只有 execution_scope = global_once 的任务允许加锁；给 per_instance 任务加全局锁
# 会让 N-1 个实例的本地状态永不刷新（门禁 scheduler-lock-scope-consistency 强制）。
shedlock:
  enabled: ${SHEDLOCK_ENABLED:false}
