server:
  port: ${SERVER_PORT:30004}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-agent}
  config:
    import: optional:application-local.yml
  flyway:
    # DDL stays in migration-runner. Agent receives DML-only grants in Wave 2.
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dinqor?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:dinqor_agent}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 5000ms
  cloud:
    nacos:
      config:
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-AGENT}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
