server:
  port: ${SERVER_PORT:30000}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-gateway}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 5000ms
  cloud:
    nacos:
      config:
        # The default profile is local and does not import Nacos. The nacos profile
        # supplies the actual required nacos: locations.
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-GATEWAY}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:https://dinqor.cn}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        # Local development may use http://localhost:30002; production must set this to
        # lb://dinqor-core-host after service discovery is enabled.
        - id: monolith-fallback
          uri: ${GATEWAY_CORE_HOST_URI:lb://dinqor-core-host}
          predicates:
            - Path=/**
          order: 9999

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,gatewaySecurity
  metrics:
    tags:
      application: ${spring.application.name}

# Fast path only. Durable Gateway bootstrap/reconcile is a separate Wave 2 step.
gateway:
  platform-integration-uri: ${GATEWAY_PLATFORM_INTEGRATION_URI:lb://dinqor-platform-integration}
  security-state:
    pubsub-enabled: ${GATEWAY_SECURITY_STATE_PUBSUB_ENABLED:false}
    pubsub-channel: ${GATEWAY_SECURITY_STATE_PUBSUB_CHANNEL:dinqor:security-events}
    reconcile-enabled: ${GATEWAY_SECURITY_STATE_RECONCILE_ENABLED:false}
    core-host-base-url: ${GATEWAY_SECURITY_STATE_CORE_HOST_BASE_URL:http://localhost:30002}
    internal-token: ${SECURITY_STATE_SYNC_INTERNAL_TOKEN:}
    reconcile-interval-ms: ${GATEWAY_SECURITY_STATE_RECONCILE_INTERVAL_MS:1500}
    full-reconcile-interval-ms: ${GATEWAY_SECURITY_STATE_FULL_RECONCILE_INTERVAL_MS:300000}
    reconcile-batch-size: ${GATEWAY_SECURITY_STATE_RECONCILE_BATCH_SIZE:500}
    request-timeout-ms: ${GATEWAY_SECURITY_STATE_REQUEST_TIMEOUT_MS:2000}
