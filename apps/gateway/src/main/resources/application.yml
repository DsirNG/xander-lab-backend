server:
  port: ${SERVER_PORT:30000}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-gateway}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-GATEWAY}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:https://dinqor.cn}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        # Local development may use http://localhost:30002; production must set this to
        # lb://dinqor-core-host after service discovery is enabled.
        - id: monolith-fallback
          uri: ${GATEWAY_CORE_HOST_URI:lb://dinqor-core-host}
          predicates:
            - Path=/**
          order: 9999

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
