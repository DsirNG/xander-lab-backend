server:
  port: ${SERVER_PORT:30003}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-bloghtml-preview}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 5000ms
  flyway:
    enabled: false
  cloud:
    nacos:
      config:
        # The default profile is local and does not import Nacos. The nacos profile
        # supplies the actual optional:nacos: locations.
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-BLOGHTML-PREVIEW}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}

blog-html:
  preview:
    page-url-pattern: ${BLOG_HTML_PAGE_URL_PATTERN:https://%s.blogHTML.dinqor.cn/raw}
    frame-ancestors: ${BLOG_HTML_FRAME_ANCESTORS:https://dinqor.cn}
    ttl-seconds: ${BLOG_HTML_PREVIEW_TTL_SECONDS:1800}
    max-code-bytes: ${BLOG_HTML_PREVIEW_MAX_CODE_BYTES:262144}
    rate-limit-max-requests: ${BLOG_HTML_PREVIEW_RATE_LIMIT_MAX_REQUESTS:10}
    rate-limit-window-seconds: ${BLOG_HTML_PREVIEW_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
