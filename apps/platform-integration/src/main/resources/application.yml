server:
  port: ${SERVER_PORT:30005}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-platform-integration}
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-PLATFORM-INTEGRATION}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}

platform-integration:
  core-base-url: ${PLATFORM_INTEGRATION_CORE_BASE_URL:http://localhost:30002}
  connect-timeout-millis: ${PLATFORM_INTEGRATION_CONNECT_TIMEOUT_MILLIS:2000}
  read-timeout-millis: ${PLATFORM_INTEGRATION_READ_TIMEOUT_MILLIS:15000}
  max-response-bytes: ${PLATFORM_INTEGRATION_MAX_RESPONSE_BYTES:16777216}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
