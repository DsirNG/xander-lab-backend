server:
  port: ${SERVER_PORT:30005}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-platform-integration}
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:COMMON}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}

platform-integration:
  core-base-url: ${PLATFORM_INTEGRATION_CORE_BASE_URL:http://localhost:30002}
  internal-api-enabled: ${PLATFORM_INTEGRATION_INTERNAL_API_ENABLED:false}
  internal-token: ${PLATFORM_INTEGRATION_INTERNAL_TOKEN:}
  core-internal-token: ${PLATFORM_INTEGRATION_CORE_INTERNAL_TOKEN:}
  connect-timeout-millis: ${PLATFORM_INTEGRATION_CONNECT_TIMEOUT_MILLIS:2000}
  read-timeout-millis: ${PLATFORM_INTEGRATION_READ_TIMEOUT_MILLIS:15000}
  max-response-bytes: ${PLATFORM_INTEGRATION_MAX_RESPONSE_BYTES:16777216}
  juejin-catalog-enabled: ${PLATFORM_INTEGRATION_JUEJIN_CATALOG_ENABLED:false}
  # The Platform authorization owner is staged independently from the compatibility bridge.
  authorization-enabled: ${PLATFORM_INTEGRATION_AUTHORIZATION_ENABLED:false}
  csdn:
    selenium-url: ${CSDN_SELENIUM_URL:http://selenium:4444/wd/hub}
    credential-encryption-key: ${CSDN_CREDENTIAL_ENCRYPTION_KEY:}
    authorization-timeout-seconds: ${CSDN_AUTHORIZATION_TIMEOUT_SECONDS:35}
    cleanup-interval-ms: ${CSDN_AUTHORIZATION_CLEANUP_INTERVAL_MS:15000}
  juejin:
    base-url: ${JUEJIN_API_BASE_URL:https://api.juejin.cn}
    default-aid: ${JUEJIN_DEFAULT_AID:2608}
    credential-encryption-key: ${JUEJIN_CREDENTIAL_ENCRYPTION_KEY:}
    connect-timeout-millis: ${JUEJIN_CONNECT_TIMEOUT_MILLIS:10000}
    read-timeout-millis: ${JUEJIN_READ_TIMEOUT_MILLIS:30000}
    catalog-freshness-hours: 24
    selenium-url: ${JUEJIN_SELENIUM_URL:http://selenium:4444/wd/hub}
    authorization-timeout-seconds: ${JUEJIN_AUTHORIZATION_TIMEOUT_SECONDS:60}
    cleanup-interval-ms: ${JUEJIN_AUTHORIZATION_CLEANUP_INTERVAL_MS:15000}
    qr-image-selector: ${JUEJIN_QR_IMAGE_SELECTOR:.qrcode-img-wrap img.qrcode-img}
  # Disabled during the bridge phase; when enabled, Platform reads credential status locally.
  credential-store-enabled: ${PLATFORM_INTEGRATION_CREDENTIAL_STORE_ENABLED:false}
  credential-store-url: ${PLATFORM_INTEGRATION_CREDENTIAL_STORE_URL:}
  credential-store-username: ${PLATFORM_INTEGRATION_CREDENTIAL_STORE_USERNAME:}
  credential-store-password: ${PLATFORM_INTEGRATION_CREDENTIAL_STORE_PASSWORD:}
  credential-store-query-timeout-seconds: ${PLATFORM_INTEGRATION_CREDENTIAL_STORE_QUERY_TIMEOUT_SECONDS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
