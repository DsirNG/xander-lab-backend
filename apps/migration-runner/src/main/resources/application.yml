spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-migration-runner}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xander_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&connectionTimeZone=Asia%2FShanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:dinqor_migration}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 2026091500
    baseline-description: pre-microservices-monolith
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:0}
