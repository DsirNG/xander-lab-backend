server:
  port: ${SERVER_PORT:30006}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dinqor-content-automation}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xander_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&connectionTimeZone=Asia%2FShanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:dinqor_content_automation}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 600000
      keepalive-time: 300000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: ${SPRING_REDIS_TIMEOUT:5000ms}
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: ${NACOS_CONFIG_IMPORT_CHECK_ENABLED:false}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DINQOR-CONTENT-AUTOMATION}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}

content-automation:
  core-base-url: ${CONTENT_AUTOMATION_CORE_BASE_URL:http://localhost:30002}
  platform-integration-base-url: ${CONTENT_AUTOMATION_PLATFORM_INTEGRATION_BASE_URL:http://localhost:30005}
  stream:
    drain-enabled: ${CONTENT_AUTOMATION_STREAM_DRAIN_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
